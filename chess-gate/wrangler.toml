name = "chess-gate"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Run the Worker in front of every /chess request on your domain.
routes = [
  { pattern = "samyugdigital.com/chess", zone_name = "samyugdigital.com" },
  { pattern = "samyugdigital.com/chess/*", zone_name = "samyugdigital.com" },
]

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put CHESS_PIN
#   wrangler secret put COOKIE_SECRET
